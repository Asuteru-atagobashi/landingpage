<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing Page</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #172033; background: #f4f7fb; }
    main { width: min(720px, calc(100% - 32px)); padding: 64px 32px; text-align: center; background: #fff; border-radius: 24px; box-shadow: 0 16px 48px rgba(23,32,51,.1); }
    h1 { margin: 0 0 16px; font-size: clamp(2rem, 7vw, 4rem); }
    p { margin: 0; color: #647087; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Landing Page</h1>
    <p>GitHub Pages 公開テスト用の仮ページです。</p>
  </main>
</body>
</html>
